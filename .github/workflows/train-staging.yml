name: train-staging

# A merge to main runs the full pipeline with the hyperparameter sweep. The registration gate
# registers the best trial as a challenger only if it beats the champion on cost avoided per
# thousand contacts, and the comparison is published on the run. Nothing is promoted here.

on:
  push:
    branches: [main]
    paths: ["src/**", "pipelines/**", "data/schema.json", "requirements.txt"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: train-staging
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: rg-careintel-prod-swc
  AML_WORKSPACE: mlw-careintel-prod-swc
  AML_IDENTITY_CLIENT_ID: ${{ secrets.AML_IDENTITY_CLIENT_ID }}
  PYTHONIOENCODING: utf-8
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pinned dependencies
        run: pip install -r requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Full pipeline with the Bayesian sweep, ending at the registration gate
        run: python -m pipelines.training --sweep --wait --report outputs/run.md

      - name: Publish the comparison against the champion
        if: always() && hashFiles('outputs/run.md') != ''
        run: cat outputs/run.md >> "$GITHUB_STEP_SUMMARY"
