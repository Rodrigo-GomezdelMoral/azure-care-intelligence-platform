name: train-dev

# Every pull request that changes the model trains it in the workspace and comments the run on the
# pull request. The trigger is the pull request, not a push to the feature branch, because the OIDC
# subject of a pull request is one fixed value a federated credential can trust, while a push to a
# feature branch carries the branch name.

on:
  pull_request:
    branches: [main]
    paths: ["src/**", "pipelines/**", "data/schema.json", "requirements.txt"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: train-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: rg-careintel-prod-swc
  AML_WORKSPACE: mlw-careintel-prod-swc
  AML_IDENTITY_CLIENT_ID: ${{ secrets.AML_IDENTITY_CLIENT_ID }}
  PYTHONIOENCODING: utf-8
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pinned dependencies
        run: pip install -r requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Train, evaluate and gate on serverless compute
        run: python -m pipelines.training --wait --report outputs/run.md

      - name: Comment the run, its test metrics and the gate's decision on the pull request
        if: always() && hashFiles('outputs/run.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file outputs/run.md
