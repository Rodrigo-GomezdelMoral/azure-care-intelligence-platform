name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pinned dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint, format, types, tests and budget
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest -q

      - name: Validate the component specifications against the Azure ML component schema
        run: |
          python - <<'EOF'
          from pathlib import Path
          from azure.ai.ml import load_component
          for spec in sorted(Path("src/components").glob("*.yml")):
              if spec.name == "conda.yml":
                  continue
              result = load_component(source=spec)._validate()
              assert result.passed, f"{spec}: {result}"
              print(f"{spec}: valid")
          EOF

      - name: Build and lint every Bicep template
        run: |
          for template in infra/main.bicep infra/modules/*.bicep; do
            az bicep build --file "$template" --stdout --only-show-errors > /dev/null
            az bicep lint --file "$template" --only-show-errors
          done

      - name: Secrets, emails and identifiers over the full history
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml --log-opts="--all" --redact --no-banner
