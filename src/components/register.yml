$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
name: register
display_name: Register model
version: 2
description: Registers the evaluated model as champion or challenger only if it beats the champion on cost avoided per thousand contacts; otherwise refuses and records the comparison.
inputs:
  model:
    type: mlflow_model
  metrics:
    type: uri_file
  model_name:
    type: string
    default: readmission-risk
  data_asset:
    type: string
  min_improvement:
    type: number
    default: 0.0
outputs:
  decision:
    type: uri_file
code: ../..
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
  conda_file: ./conda.yml
command: >-
  python -m src.components.register --model ${{inputs.model}} --metrics ${{inputs.metrics}}
  --model-name ${{inputs.model_name}} --data-asset ${{inputs.data_asset}}
  --min-improvement ${{inputs.min_improvement}} --decision ${{outputs.decision}}
