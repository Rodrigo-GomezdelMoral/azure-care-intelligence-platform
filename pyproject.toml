[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "BLE", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]
files = ["."]
exclude = ["examples/"]

[[tool.mypy.overrides]]
module = ["sdv.*", "shap.*", "sklearn.*", "mlflow.*", "pgvector.*", "azureml.*", "evidently.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
